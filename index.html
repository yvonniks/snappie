<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FF6B47" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Snappie" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Snappie</title>
    <script>
      // GitHub Pages SPA redirect receiver: restores the original URL
      // that was encoded by 404.html so React Router sees the correct path.
      (function() {
        var p = window.location.search.slice(1).split('&').reduce(function(acc, s) {
          var r = s.split('='); acc[r[0]] = r.slice(1).join('=').replace(/~and~/g, '&'); return acc;
        }, {});
        if (p.p !== undefined) {
          window.history.replaceState(
            null, null,
            window.location.pathname.split('/').slice(0, 2).join('/') +
            '/' + p.p + (p.q ? '?' + p.q : '') + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
